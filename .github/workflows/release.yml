name: Three-platform release packages

on:
  workflow_dispatch:
  push:
    tags: ['v*']
    branches: [main]
    paths: ['.github/workflows/release.yml', '.github/workflows/linux.yml', '.github/workflows/windows.yml', '.github/workflows/macos.yml', 'crates/freeshow-media/**', 'crates/freeshow-record/**']

permissions:
  contents: read

jobs:
  linux:
    uses: ./.github/workflows/linux.yml
  windows:
    uses: ./.github/workflows/windows.yml
  macos:
    uses: ./.github/workflows/macos.yml
