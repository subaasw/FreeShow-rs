name: Package (Linux)

# Reusable: called only by release.yml (tag push or manual dispatch).
on:
  workflow_call:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install native build and media dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config patchelf binutils python3 desktop-file-utils libglib2.0-bin \
            libasound2-dev libudev-dev libfontconfig1-dev libxkbcommon-dev libwayland-dev libx11-dev libxi-dev libxcursor-dev libxrandr-dev libgl1-mesa-dev mesa-vulkan-drivers \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libgstreamer-plugins-bad1.0-dev gstreamer1.0-tools gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad gstreamer1.0-nice gstreamer1.0-plugins-ugly gstreamer1.0-libav gstreamer1.0-alsa gstreamer1.0-pulseaudio
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Restore native compilation cache
        id: native-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            target
          key: linux-ubuntu24-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: linux-ubuntu24-${{ hashFiles('Cargo.lock') }}-
      - name: Compile native workspace tests
        run: bash scripts/ci-run.sh cargo test --locked --workspace --no-run
      - name: Run native workspace tests
        run: bash scripts/ci-run.sh timeout --kill-after=30s 12m cargo test --locked --workspace
      - name: Build and verify the Linux archive
        run: bash scripts/ci-run.sh scripts/package.sh
      - name: Verify after removing the system GStreamer runtime
        run: |
          sudo apt-get remove -y libgstreamer1.0-0 libgstreamer-plugins-base1.0-0
          python3 - <<'PY'
          import json, pathlib, subprocess, sys, tempfile

          root = pathlib.Path.cwd()
          sys.path.insert(0, str(root / 'scripts'))
          from package_media import serve_sample

          apps = list((root / 'dist').glob('freeshow-*/freeshow-rust-*-linux-x86_64'))
          assert len(apps) == 1, apps
          app = apps[0] / 'AppRun'
          sample = root / 'crates/freeshow-data/tests/fixtures/lesson-clip.mp4'
          with tempfile.TemporaryDirectory(prefix='freeshow-clean-runtime-') as temp:
              env = {'HOME': temp, 'PATH': '/usr/bin:/bin', 'LANG': 'C.UTF-8'}
              subprocess.run([str(app), '--check-media', str(sample)], env=env, check=True, timeout=60)
              with serve_sample(sample) as url:
                  subprocess.run([str(app), '--check-media', url], env=env, check=True, timeout=60)
              perf = subprocess.run([str(app), '--check-perf'], env=env, text=True, stdout=subprocess.PIPE, timeout=180)
              print(perf.stdout, end='', flush=True)
              perf.check_returncode()
          (app.parent.parent / 'linux-check-perf.json').write_text(perf.stdout)
          report = {'system_gstreamer_removed': True, 'empty_home_and_registry': True, 'h264_decoded': True, 'http_video_decoded': True}
          (app.parent.parent / 'linux-clean-runtime.json').write_text(json.dumps(report, indent=2) + '\n')
          print('::notice::' + json.dumps(report))
          PY
      - name: Upload the installable archive and verification reports
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: freeshow-linux-x86_64
          path: |
            dist/freeshow-*/*.tar.gz
            dist/freeshow-*/*.sha256
            dist/freeshow-*/linux-*.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Save native compilation cache
        if: always() && steps.native-cache.outcome == 'success' && steps.native-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            target
          key: ${{ steps.native-cache.outputs.cache-primary-key }}
