<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FreeShow remote</title>
  <link rel="icon" href="data:,">
  <style>
    :root {
      color-scheme: dark;
      --bg: #12121c;
      --panel: #242832;
      --accent: #f0008c;
      --text: #f0f0ff;
      --muted: #aaaaaa;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 18px/1.4 system-ui, sans-serif;
    }
    header, main { padding: 16px; }
    h1 { margin: 0; font-size: 1.1rem; }
    h2 { margin: 0 0 8px; font-size: 0.85rem; color: var(--muted); font-weight: 600; }
    #show-name { margin: 6px 0 0; color: var(--muted); }
    .lines {
      min-height: 4.5rem;
      margin: 0;
      white-space: pre-wrap;
      font-size: 1.6rem;
    }
    .controls, .columns { display: flex; gap: 12px; }
    .columns { align-items: flex-start; }
    .columns section { flex: 1; min-width: 0; }
    button {
      flex: 1;
      min-height: 56px;
      border: 0;
      border-radius: 10px;
      background: var(--panel);
      color: var(--text);
      font: inherit;
      text-align: left;
      padding: 12px;
    }
    .controls button { text-align: center; font-weight: 650; }
    fieldset { min-width: 0; border: 0; padding: 0; margin: 0; }
    fieldset:disabled { opacity: 0.55; }
    #enter-password { margin-top: 8px; min-height: 44px; }
    select { font: inherit; max-width: 100%; }
    #next { background: var(--accent); }
    button.active { outline: 2px solid var(--accent); }
    .next-lines { margin: 4px 0 12px; color: var(--muted); white-space: pre-wrap; font-size: 1rem; min-height: 1.4rem; }
    .secondary { margin-top: 8px; }
    .secondary button { min-height: 44px; font-size: 0.9rem; font-weight: 500; }
    .section-row { color: var(--muted); font-size: 0.8rem; font-weight: 650; text-transform: uppercase; padding: 6px 2px 0; }
    .row-note { color: var(--muted); font-size: 0.8rem; }
    #show-filter { width: 100%; font: inherit; padding: 8px 10px; border-radius: 8px; border: 0; background: var(--panel); color: var(--text); margin-bottom: 8px; }
    .group { display: inline-block; font-size: 0.75rem; color: var(--muted); margin-right: 6px; }
    ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
    @media (max-width: 700px) {
      .columns { flex-direction: column; }
    }
  </style>
</head>
<body>
  <header>
    <h1>FreeShow</h1>
    <p id="show-name" role="status">Connecting</p>
    <button id="enter-password" type="button" hidden>Enter password</button>
    <p id="command-status" role="status" hidden></p>
  </header>
  <main>
    <p id="lines" class="lines"></p>
    <p id="next-lines" class="next-lines"></p>
    <fieldset id="remote-controls" aria-label="Show controls" disabled>
      <div class="controls">
        <button id="prev" type="button">Previous</button>
        <button id="next" type="button">Next</button>
        <button id="clear" type="button">Clear</button>
      </div>
      <div class="controls secondary">
        <button id="prev-item" type="button">Previous item</button>
        <button id="next-item" type="button">Next item</button>
        <button id="clear-slide" type="button">Hide text</button>
        <button id="clear-background" type="button">Stop background</button>
      </div>
      <div class="columns" style="margin-top: 16px">
        <section>
          <h2 id="project-title">Project</h2>
          <ul id="project"></ul>
          <h2 style="margin-top: 16px">Slides</h2>
          <ul id="slides"></ul>
        </section>
        <section>
          <h2>Shows</h2>
          <input id="show-filter" type="search" placeholder="Find a show" aria-label="Find a show">
          <ul id="shows"></ul>
        </section>
        <section>
          <h2>Overlays</h2>
          <ul id="overlays"></ul>
          <h2 style="margin-top: 16px">Timers</h2>
          <ul id="timers"></ul>
          <h2 style="margin-top: 16px">Media</h2>
          <ul id="media"></ul>
          <label for="audio-channel">Audio channel</label>
          <select id="audio-channel"><option value="main">Main</option></select>
          <button id="channel-mute" type="button" aria-pressed="false">Mute</button>
          <label for="volume">Volume</label>
          <input id="volume" type="range" min="0" max="100" value="100">
        </section>
      </div>
    </fieldset>
  </main>
  <script>
    let busy = false;
    let connected = false;
    let actionPending = false;
    let connectionRevision = 0;
    let channelState = {};
    let lastStateText = "";
    let lastFilter = "";
    let secret = "";
    try { secret = localStorage.getItem("freeshow-password") || ""; } catch {}

    const controls = document.getElementById("remote-controls");
    const heading = document.getElementById("show-name");
    const enterPassword = document.getElementById("enter-password");
    const commandStatus = document.getElementById("command-status");

    function disconnect(message, locked = false) {
      connectionRevision += 1;
      connected = false;
      lastStateText = "";
      controls.disabled = true;
      heading.textContent = message;
      enterPassword.hidden = !locked;
      if (locked) {
        document.getElementById("lines").textContent = "";
        document.getElementById("next-lines").textContent = "";
        for (const id of ["project", "slides", "shows", "overlays", "timers", "media"]) {
          document.getElementById(id).replaceChildren();
        }
        document.getElementById("project-title").textContent = "Project";
        // Drop protected information from the disabled controls too.
        document.getElementById("audio-channel").replaceChildren();
        channelState = {};
      }
    }

    async function request(url, options = {}, readBody = false) {
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), 4000);
      try {
        const response = await fetch(url, {
          ...options,
          headers: { ...options.headers, "x-freeshow-password": secret },
          cache: "no-store",
          signal: controller.signal
        });
        return { status: response.status, ok: response.ok,
          text: response.ok && readBody ? await response.text() : "" };
      } finally {
        clearTimeout(timer);
      }
    }

    async function act(channel, data) {
      if (!connected || actionPending) return;
      commandStatus.hidden = true;
      actionPending = true;
      try {
        const response = await request("/action", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ channel: channel, data: data == null ? null : data })
        });
        if (response.status === 401) {
          disconnect("Password required", true);
          return;
        }
        if (!response.ok) throw new Error("Action response failed");
      } catch {
        commandStatus.textContent = "Command status unknown. Check the live cue before trying again.";
        commandStatus.hidden = false;
        disconnect("Lost the connection to FreeShow, retrying…");
      } finally {
        actionPending = false;
      }
      await refresh();
    }

    function item(label, active, onClick) {
      const button = document.createElement("button");
      button.type = "button";
      button.textContent = label;
      if (active) button.className = "active";
      button.addEventListener("click", onClick);
      const li = document.createElement("li");
      li.appendChild(button);
      return li;
    }

    async function refresh() {
      if (busy) return;
      busy = true;
      const revision = connectionRevision;
      try {
        const response = await request("/state", {}, true);
        if (revision !== connectionRevision) return;
        if (response.status === 401) {
          disconnect("Password required", true);
          return;
        }
        if (!response.ok) throw new Error("State response failed");
        // Rebuilding only on change keeps a button under a finger from being replaced mid-tap.
        const text = response.text;
        const filterText = document.getElementById("show-filter").value;
        if (text === lastStateText && filterText === lastFilter) return;
        const state = JSON.parse(text);
        lastStateText = text;
        lastFilter = filterText;
        heading.textContent = state.cleared
          ? "Cleared"
          : (state.show_name || "No show");
        document.getElementById("lines").textContent = state.cleared
          ? ""
          : (state.lines || []).join("\n");
        document.getElementById("next-lines").textContent = state.cleared || !(state.next_lines || []).length
          ? ""
          : "Next: " + state.next_lines.join(" / ");
        const project = (state.projects || []).find((entry) => entry.id === state.project_id);
        document.getElementById("project-title").textContent = project ? project.name : "Project";
        const projectList = document.getElementById("project");
        projectList.replaceChildren();
        if (!project || !(project.shows || []).length) {
          const empty = document.createElement("li");
          empty.className = "row-note";
          empty.textContent = project ? "This project is empty." : "No project is open.";
          projectList.appendChild(empty);
        }
        ((project && project.shows) || []).forEach((entry, index) => {
          if (entry.kind === "section") {
            const header = document.createElement("li");
            header.className = "section-row";
            header.textContent = entry.name;
            projectList.appendChild(header);
            return;
          }
          const label = entry.kind && entry.kind !== "show" ? entry.name + " (" + entry.kind + ")" : entry.name;
          projectList.appendChild(item(label, index === state.project_item, () =>
            act("API:index_select_project_item", { index: index })));
        });
        const shows = document.getElementById("shows");
        shows.replaceChildren();
        const filter = document.getElementById("show-filter").value.trim().toLowerCase();
        (state.shows || []).forEach((show, index) => {
          if (filter && !show.name.toLowerCase().includes(filter)) return;
          shows.appendChild(item(show.name, index === state.show_index, () => act("SHOW", show.id)));
        });
        const overlays = document.getElementById("overlays");
        overlays.replaceChildren();
        const activeOverlays = state.active_overlays || [];
        if (!(state.overlays || []).length) {
          const empty = document.createElement("li");
          empty.className = "row-note";
          empty.textContent = "No overlays yet.";
          overlays.appendChild(empty);
        }
        (state.overlays || []).forEach((overlay) => {
          const shown = activeOverlays.includes(overlay.id);
          overlays.appendChild(item((shown ? "Hide " : "Show ") + overlay.name, shown, () =>
            act(shown ? "API:clear_overlay" : "API:id_select_overlay", { id: overlay.id })));
        });
        const timers = document.getElementById("timers");
        timers.replaceChildren();
        (state.timers || []).forEach((timer) => {
          const running = state.active_timer === timer.id && !state.timer_paused;
          const li = document.createElement("li");
          li.className = "controls";
          const start = document.createElement("button");
          start.type = "button";
          start.textContent = (running ? "Pause " : "Start ") + timer.name;
          if (state.active_timer === timer.id) start.className = "active";
          start.addEventListener("click", () => act(running ? "API:id_pause_timer" : "API:id_start_timer", { id: timer.id }));
          const stop = document.createElement("button");
          stop.type = "button";
          stop.textContent = "Stop";
          stop.style.flex = "0 0 auto";
          stop.addEventListener("click", () => act("API:id_stop_timer", { id: timer.id }));
          li.append(start, stop);
          timers.appendChild(li);
        });
        const media = document.getElementById("media");
        media.replaceChildren();
        (state.media || []).concat(state.audio || []).forEach((file) => {
          media.appendChild(item(file.name, false, () => act("API:play_media", { path: file.name })));
        });
        const channelSelect = document.getElementById("audio-channel");
        const selected = channelSelect.value;
        const mixer = state.audio_mixer || {};
        channelState = mixer.audioChannelsData || {main: {volume: state.volume}};
        const channels = (mixer.audioRouting || {}).channels || [{id: "main", name: "Main"}];
        channelSelect.replaceChildren(...channels.map((channel) => {
          const option = document.createElement("option");
          option.value = channel.id;
          option.textContent = channel.name || channel.id;
          return option;
        }));
        if (channels.some((channel) => channel.id === selected)) channelSelect.value = selected;
        updateChannel();
        const slides = document.getElementById("slides");
        slides.replaceChildren();
        const current = state.shows && state.show_index != null ? state.shows[state.show_index] : null;
        (current ? current.slides : []).forEach((slide, index) => {
          const label = slide.label || (slide.lines || []).join(" ");
          const active = !state.cleared && index === state.slide_index;
          slides.appendChild(item(label, active, () => act("API:index_select_slide", {
            index: index,
            showId: current.id
          })));
        });
        connected = true;
        controls.disabled = false;
        enterPassword.hidden = true;
      } catch {
        if (revision === connectionRevision) disconnect("Lost the connection to FreeShow, retrying…");
      } finally {
        busy = false;
      }
    }

    document.getElementById("next").addEventListener("click", () => act("API:next_slide"));
    enterPassword.addEventListener("click", () => {
      const value = prompt("Remote password");
      if (value == null) return;
      secret = value;
      try { localStorage.setItem("freeshow-password", value); } catch {}
      connectionRevision += 1;
      refresh();
    });
    document.getElementById("prev").addEventListener("click", () => act("API:previous_slide"));
    document.getElementById("clear").addEventListener("click", () => act("API:clear_all"));
    document.getElementById("next-item").addEventListener("click", () => act("API:next_project_item"));
    document.getElementById("prev-item").addEventListener("click", () => act("API:previous_project_item"));
    document.getElementById("clear-slide").addEventListener("click", () => act("API:clear_slide"));
    document.getElementById("clear-background").addEventListener("click", () => act("API:clear_background"));
    document.getElementById("show-filter").addEventListener("input", () => refresh());
    function updateChannel() {
      const id = document.getElementById("audio-channel").value;
      const channel = channelState[id] || {};
      const volume = document.getElementById("volume");
      if (document.activeElement !== volume) volume.value = String(Math.round((channel.volume ?? 1) * 100));
      const mute = document.getElementById("channel-mute");
      mute.textContent = channel.isMuted ? "Unmute" : "Mute";
      mute.setAttribute("aria-pressed", String(!!channel.isMuted));
    }
    document.getElementById("audio-channel").addEventListener("change", updateChannel);
    document.getElementById("channel-mute").addEventListener("click", () => {
      const id = document.getElementById("audio-channel").value;
      act("API:mute", {id, value: !channelState[id]?.isMuted});
    });
    document.getElementById("volume").addEventListener("change", (event) => {
      act("API:change_volume", { channelId: document.getElementById("audio-channel").value, volume: Number(event.target.value) / 100 });
    });
    refresh();
    setInterval(refresh, 1000);
  </script>
</body>
</html>
