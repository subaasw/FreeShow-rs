<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FreeShow stage</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: #12121c;
      color: #f0f0ff;
      font: 20px/1.3 system-ui, sans-serif;
      display: grid;
      grid-template-rows: auto 1fr auto auto;
      padding: 28px 36px;
    }
    body.preview { display: block; padding: 0; background: #000; }
    #stage-frame { width: 100%; height: 100vh; object-fit: contain; }
    body.preview #stage-frame { display: block; }
    body.preview p { display: none; }
    #clock { margin: 0; color: #f0008c; font-variant-numeric: tabular-nums; }
    #lines {
      margin: 0;
      align-self: center;
      white-space: pre-wrap;
      font-size: clamp(2rem, 6vw, 5rem);
    }
    #next, #notes { margin: 8px 0 0; color: #aaaaaa; white-space: pre-wrap; }
    #next { font-size: clamp(1.2rem, 3vw, 2.2rem); }
  </style>
</head>
<body>
  <img id="stage-frame" alt="Current stage layout" hidden>
  <p id="clock"></p>
  <p id="lines"></p>
  <p id="next"></p>
  <p id="notes"></p>
  <script>
    let passwordAttempts = 0;
    let frameUrl;
    let useFrame = true;
    const stageFrame = document.getElementById("stage-frame");

    function hideFrame() {
      document.body.classList.remove("preview");
      stageFrame.hidden = true;
      stageFrame.removeAttribute("src");
      if (frameUrl) URL.revokeObjectURL(frameUrl);
      frameUrl = undefined;
    }

    function password() {
      return localStorage.getItem("freeshow-password") || "";
    }

    async function authorizedFetch(url, options = {}) {
      options.headers = Object.assign({}, options.headers, {
        "x-freeshow-password": password()
      });
      let response = await fetch(url, options);
      if (response.status !== 401 || passwordAttempts >= 2) return response;
      passwordAttempts += 1;
      const value = prompt("Stage password");
      if (value == null) return response;
      localStorage.setItem("freeshow-password", value);
      options.headers["x-freeshow-password"] = value;
      return fetch(url, options);
    }

    function paintClock() {
      document.getElementById("clock").textContent = new Date().toLocaleTimeString();
    }

    async function refresh() {
      let response;
      if (useFrame) {
        response = await authorizedFetch("/stage-frame", { cache: "no-store" });
        if (response.ok) {
          const nextUrl = URL.createObjectURL(await response.blob());
          stageFrame.src = nextUrl;
          stageFrame.hidden = false;
          document.body.classList.add("preview");
          if (frameUrl) URL.revokeObjectURL(frameUrl);
          frameUrl = nextUrl;
          return;
        }
        if (response.status === 404) useFrame = false;
        else if (response.status !== 401) return;
      }
      if (!useFrame) response = await authorizedFetch("/state");
      if (response.status === 401) {
        hideFrame();
        document.getElementById("lines").textContent = "Password required";
        document.getElementById("next").textContent = "";
        document.getElementById("notes").textContent = "";
        return;
      }
      if (!response.ok) return;
      const state = await response.json();
      document.getElementById("lines").textContent = (state.lines || []).join("\n");
      const next = state.next_lines || [];
      document.getElementById("next").textContent = next.length ? next.join("\n") : "";
      document.getElementById("notes").textContent = state.notes || "";
    }

    paintClock();
    setInterval(paintClock, 1000);
    async function poll() {
      try {
        await refresh();
      } catch {
        // Keep the last frame through a transient network interruption.
      } finally {
        setTimeout(poll, 500);
      }
    }
    poll();
  </script>
</body>
</html>
