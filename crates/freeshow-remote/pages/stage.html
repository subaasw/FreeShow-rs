<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FreeShow stage</title>
  <link rel="icon" href="data:,">
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: #12121c;
      color: #f0f0ff;
      font: 20px/1.3 system-ui, sans-serif;
      display: grid;
      grid-template-rows: auto 1fr auto auto;
      padding: 28px 36px;
    }
    body.preview { display: block; padding: 0; background: #000; }
    #stage-frame { width: 100%; height: 100vh; object-fit: contain; }
    body.preview #stage-frame { display: block; }
    body.preview p { display: none; }
    #clock { margin: 0; color: #f0008c; font-variant-numeric: tabular-nums; }
    #lines {
      margin: 0;
      align-self: center;
      white-space: pre-wrap;
      font-size: clamp(2rem, 6vw, 5rem);
    }
    #next, #notes { margin: 8px 0 0; color: #aaaaaa; white-space: pre-wrap; }
    #next { font-size: clamp(1.2rem, 3vw, 2.2rem); }
    #status {
      position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%);
      margin: 0; padding: 6px 14px; border-radius: 999px;
      background: #000000c0; color: #f0f0ff; font-size: 15px;
      transition: opacity 0.6s; pointer-events: none;
    }
    #status.gone { opacity: 0; }
    body.preview #status { display: block; }
    #enter-password { position: fixed; top: 16px; right: 16px; font: inherit; padding: 8px 12px; }
  </style>
</head>
<body>
  <img id="stage-frame" alt="Current stage layout" hidden>
  <p id="clock"></p>
  <p id="lines"></p>
  <p id="next"></p>
  <p id="notes"></p>
  <p id="status" role="status">Tap for full screen</p>
  <button id="enter-password" type="button" hidden>Enter password</button>
  <script>
    let frameUrl;
    let useFrame = true;
    let locked = false;
    let secret = "";
    try { secret = localStorage.getItem("freeshow-password") || ""; } catch {}
    const stageFrame = document.getElementById("stage-frame");
    const enterPassword = document.getElementById("enter-password");

    function hideFrame() {
      document.body.classList.remove("preview");
      stageFrame.hidden = true;
      stageFrame.removeAttribute("src");
      if (frameUrl) URL.revokeObjectURL(frameUrl);
      frameUrl = undefined;
    }

    async function request(url, read) {
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), 6000);
      try {
        const response = await fetch(url, {
          headers: { "x-freeshow-password": secret },
          cache: "no-store", signal: controller.signal
        });
        return { status: response.status, ok: response.ok,
          body: response.ok ? await response[read]() : null };
      } finally {
        clearTimeout(timer);
      }
    }

    function paintClock() {
      document.getElementById("clock").textContent = new Date().toLocaleTimeString();
    }

    async function refresh() {
      let response;
      if (useFrame) {
        response = await request("/stage-frame", "blob");
        if (response.ok) {
          const nextUrl = URL.createObjectURL(response.body);
          stageFrame.src = nextUrl;
          stageFrame.hidden = false;
          document.body.classList.add("preview");
          if (frameUrl) URL.revokeObjectURL(frameUrl);
          frameUrl = nextUrl;
          return true;
        }
        if (response.status === 404) useFrame = false;
      }
      if (!useFrame) response = await request("/state", "json");
      if (response.status === 401) {
        hideFrame();
        document.getElementById("lines").textContent = "";
        document.getElementById("next").textContent = "";
        document.getElementById("notes").textContent = "";
        return false;
      }
      if (!response.ok) throw new Error("Stage response failed");
      const state = response.body;
      document.getElementById("lines").textContent = (state.lines || []).join("\n");
      const next = state.next_lines || [];
      document.getElementById("next").textContent = next.length ? next.join("\n") : "";
      document.getElementById("notes").textContent = state.notes || "";
      return true;
    }

    const status = document.getElementById("status");
    let failures = 0;
    let hintTimer = setTimeout(() => status.classList.add("gone"), 4000);
    function showStatus(text, sticky) {
      status.textContent = text;
      status.classList.remove("gone");
      clearTimeout(hintTimer);
      if (!sticky) hintTimer = setTimeout(() => status.classList.add("gone"), 3000);
    }
    enterPassword.addEventListener("click", (event) => {
      event.stopPropagation();
      const value = prompt("Stage password");
      if (value == null) return;
      secret = value;
      try { localStorage.setItem("freeshow-password", value); } catch {}
    });
    // A tablet on a music stand is easier to read without browser bars.
    document.addEventListener("click", () => {
      const root = document.documentElement;
      if (!document.fullscreenElement && root.requestFullscreen) {
        root.requestFullscreen().catch(() => {});
      } else if (document.exitFullscreen) {
        document.exitFullscreen().catch(() => {});
      }
    });

    paintClock();
    setInterval(paintClock, 1000);
    async function poll() {
      try {
        const authorized = await refresh();
        if (!authorized && (!locked || failures >= 3)) showStatus("Password required", true);
        if (authorized && (locked || failures >= 3)) showStatus("Connected", false);
        locked = !authorized;
        enterPassword.hidden = authorized;
        failures = 0;
      } catch {
        // Keep the last frame through a transient network interruption, but say so if it lasts.
        failures += 1;
        if (failures === 3) showStatus("Lost the connection to FreeShow, retrying…", true);
      } finally {
        setTimeout(poll, 500);
      }
    }
    poll();
  </script>
</body>
</html>
