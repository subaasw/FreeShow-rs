[package]
name = "freeshow-record"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Audience recording and RTMP for freeshow-rust"

[dependencies]
base64 = "0.22"
freeshow-core = { path = "../freeshow-core" }
freeshow-media = { path = "../freeshow-media" }
gstreamer = "0.23"
gstreamer-app = "0.23"
gstreamer-sdp = { version = "0.23", optional = true }
gstreamer-webrtc = { version = "0.23", optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tracing = "0.1"
ureq = "2.12"
webpki-roots = "1"

[features]
default = ["webrtc"]
webrtc = ["dep:gstreamer-webrtc", "dep:gstreamer-sdp"]
