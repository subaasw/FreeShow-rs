[package]
name = "freeshow"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "FreeShow native presenter"

[dependencies]
freeshow-core = { path = "../freeshow-core" }
freeshow-data = { path = "../freeshow-data" }
freeshow-media = { path = "../freeshow-media" }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
freeshow-output = { path = "../freeshow-output" }
freeshow-remote = { path = "../freeshow-remote" }
freeshow-osc = { path = "../freeshow-osc" }
freeshow-midi = { path = "../freeshow-midi" }
freeshow-ndi = { path = "../freeshow-ndi" }
freeshow-timecode = { path = "../freeshow-timecode" }
freeshow-record = { path = "../freeshow-record" }
freeshow-pco = { path = "../freeshow-pco" }
freeshow-churchapps = { path = "../freeshow-churchapps" }
freeshow-cloud = { path = "../freeshow-cloud" }
freeshow-obs = { path = "../freeshow-obs" }
freeshow-ai = { path = "../freeshow-ai" }
serde_json = "1"
ureq = "2.12"
sha2 = "0.10"
slint = { version = "1.18.1", default-features = false, features = ["std", "compat-1-18", "backend-winit", "renderer-femtovg-wgpu", "accessibility", "unstable-wgpu-30", "unstable-winit-030"] }
tracing = "0.1"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_ProcessStatus", "Win32_System_Threading"] }

[features]
default = []
hid = []
